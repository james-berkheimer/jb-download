[build-system]
requires = ["hatchling>=1.0"]
build-backend = "hatchling.build"

[project]
name = "jb-download"
dynamic = ["version"]
authors = [{ name = "James Berkheimer", email = "james.berkheimer@gmail.com" }]
description = "A set of tools to help download media files"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = ["click>=8.1.3", "colorlog>=6.4.1", "yt-dlp>=2024.1.1"]

[project.scripts]
jb-download = "jb_download.cli:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=7.0",
    "coverage>=6.0",
    "hatchling>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["jb_download"]
artifacts = ["jb_download/default_settings.json"]

[tool.hatch.version]
path = "VERSION"
pattern = "^(?P<version>.+)$"


[tool.coverage.run]
source = ["jb_download"]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
