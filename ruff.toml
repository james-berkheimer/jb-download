# Basic configuration
line-length = 105
indent-width = 4
target-version = "py312"
# Fixes are applied explicitly via `ruff check --fix`, never as a side effect
# of a bare `ruff check` (which CI runs with --no-fix).
fix = false
unsafe-fixes = false

# Exclude commonly ignored directories
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "vendor",
    "generated",
]


[lint]
select = [
    "B",   # flake8-bugbear
    "C",   # mccabe complexity
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "N",   # PEP8 naming
    "W",   # pycodestyle warnings
    "B9",  # flake8-bugbear additional rules
    "I",   # isort
    "ISC", # flake8-implicit-str-concat
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ANN", # flake8-annotations
    "Q",   # flake8-quotes
    "S",   # flake8-bandit security rules
    "D",   # pydocstyle
    "RET", # flake8-return
    "A",   # flake8-builtins
    "G",   # flake8-logging-format
    "BLE", # flake8-blind-except
    "PTH", # flake8-use-pathlib
    "SIM", # flake8-simplify
]

# Ignore rules
ignore = [
    "E203",   # Whitespace before ':' -- conflicts with the formatter
    "ISC001", # Implicit string concatenation -- conflicts with the formatter
    "G004",   # f-string in logging call -- deliberate, messages are always emitted
]

# Fix settings
fixable = ["ALL"]
unfixable = ["F401", "F841"]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Per-file ignore settings
[lint.per-file-ignores]
"tests/*" = ["S101", "ANN", "D"]
"__init__.py" = ["F401"]

[lint.pydocstyle]
convention = "google"

[lint.mccabe]
max-complexity = 10

[lint.isort]
known-first-party = ["jb_download"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]
combine-as-imports = true

[lint.flake8-annotations]
mypy-init-return = true
suppress-none-returning = false

[lint.pycodestyle]
max-doc-length = 120

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = 80
